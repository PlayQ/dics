name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore DICS.sln
      - run: dotnet build DICS.sln -c Release --no-restore
      - run: dotnet test DICS.sln -c Release --no-build
